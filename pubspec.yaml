name: dxx_shortdrama
description: "DXX ShortDrama Streaming App (Flutter)"
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.14.1
  flutter_riverpod: ^3.4.3
  get_it: ^9.3.0
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.6
  firebase_core: ^3.4.0
  firebase_analytics: ^11.3.0
  firebase_remote_config: ^5.0.1
  adjust_sdk: ^5.6.2
  package_info_plus: ^8.1.2
  dio: ^5.7.0
  cryptography: ^2.7.0
  crypto: ^3.0.6
  uuid: ^4.5.1
  device_info_plus: ^11.1.0
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.2
  lottie: ^3.1.0
  country_flags: 4.1.2
  easy_ads_flutter:
    path: modules/easy-ads-master
  url_launcher: ^6.3.3
  in_app_review: ^2.0.12
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  shared_preferences_android: 2.4.27

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/json/

  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/BeVietnamPro-Black.ttf
          weight: 900
    - family: Spectral
      fonts:
        - asset: assets/fonts/Spectral-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Spectral-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Spectral-BoldItalic.ttf
          weight: 700
          style: italic

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#040605"
  adaptive_icon_foreground: "assets/images/app_icon.png"
